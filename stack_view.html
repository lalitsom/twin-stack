<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Graph</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/style/main.css">
</head>

<body class="bg-gray-50">
    <div id="navbar-placeholder"></div>
    <div id="visualization-container" class="relative w-screen" style="height: calc(100vh - 64px);">
        <svg id="visualization"></svg>
    </div>

    <!-- div to encapsulate all buttons -->
    <div id="navbar" class=" absolute top-20 left-4 space-x-2">
        <button id="toggle-controls-btn"
            class="border border-blue-500 text-blue-500 bg-white hover:bg-blue-500 hover:text-white font-bold py-1 px-3 text-sm rounded">
            Controls
        </button>

        <div class="relative inline-block">
            <input id="stack-search" type="text" placeholder="Search design..."
                class="border border-gray-400 px-3 py-1 rounded text-sm w-72" autocomplete="off" />
            <ul id="stack-dropdown"
                class="absolute mt-1 w-48 bg-white border border-gray-300 rounded shadow-lg hidden max-h-40 overflow-y-auto z-10">
            </ul>
        </div>

        <div class="relative inline-block">
            <select id="date-select" class="border border-gray-400 px-3 py-1 rounded text-sm" disabled>
                <option>Select a date</option>
            </select>
        </div>
        <button id="download-stack-btn"
            class="border border-blue-500 text-blue-500 bg-white hover:bg-blue-500 hover:text-white font-bold py-1 px-3 text-sm rounded">
            Download
        </button>
    </div>

    <div id="control-panel" class="absolute top-4 left-4 bg-gray-100 p-4 rounded-lg shadow-lg w-80 hidden text-sm">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold">Controls</h2>
            <button id="close-controls-btn" class="text-gray-500 hover:text-gray-800 text-xl font-bold">&times;</button>
        </div>

        <!-- Animation Toggle -->
        <div class="flex items-center justify-between mb-4">
            <span class="font-semibold">Show Traffic</span>
            <label for="animation-toggle" class="inline-flex relative items-center cursor-pointer">
                <input type="checkbox" id="animation-toggle" class="sr-only peer">
                <div
                    class="w-9 h-5 bg-gray-200 rounded-full peer peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600">
                </div>
            </label>
        </div>

        <div class="flex items-center justify-between mb-4">
            <span class="font-semibold">Playground mode</span>
            <label for="playground-toggle" class="inline-flex relative items-center cursor-pointer">
                <input type="checkbox" id="playground-toggle" class="sr-only peer">
                <div
                    class="w-9 h-5 bg-gray-200 rounded-full peer peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600">
                </div>
            </label>
        </div>

        <div class="mt-4 pt-4 border-t border-gray-300">
            <h3 class="font-semibold mb-2">Add Component</h3>
            <div class="flex flex-col space-y-2">
                <input type="text" id="component-name" placeholder="Component Name"
                    class="border border-gray-400 px-3 py-1 rounded text-sm">
                <button id="add-btn"
                    class="border border-blue-500 text-blue-500 bg-white hover:bg-blue-500 hover:text-white font-bold py-1 px-3 text-sm rounded">
                    Add Node
                </button>
            </div>
        </div>
    </div>

    <div id="info-panel" class="absolute top-4 right-4 bg-gray-100 pl-4 pr-4 pb-4 rounded-lg shadow-lg w-80 hidden text-sm max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center mb-4 sticky top-0 bg-gray-100 pt-2">
            <h2 class="text-lg font-bold">Node Info</h2>
            <button id="close-info-btn" class="text-gray-500 hover:text-gray-800 text-xl font-bold">&times;</button>
        </div>
        <div id="info-panel-content"></div>
    </div>

    <div id="info-button-container" class="absolute bottom-4 left-4">
        <button id="info-btn" class="border border-blue-500 text-blue-500 bg-white hover:bg-blue-500 hover:text-white font-bold py-1 px-3 text-sm rounded">
            Stack Info
        </button>
    </div>

    <div id="stack-info-panel" class="absolute bottom-16 left-4 bg-gray-100 p-4 rounded-lg shadow-lg w-80 hidden text-sm">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold">Stack Info</h2>
            <button id="close-stack-info-btn" class="text-gray-500 hover:text-gray-800 text-xl font-bold">&times;</button>
        </div>
        <div id="stack-info-panel-content"></div>
    </div>

    <script src="assets/scripts/ui_actions.js"></script>
    <script src="assets/scripts/render.js"></script>
    <script src="assets/scripts/simulator_des_simpy.js"></script>
    <script src="assets/scripts/main.js"></script>
</body>

</html>
