<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/style/main.css">
    <link rel="stylesheet" href="assets/style/hardware.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">
    <!-- Navbar Placeholder -->
    <div id="navbar-placeholder"></div>

    <!-- Main Content -->
    <div class="flex flex-1 overflow-hidden relative">
        <!-- Inventory Sidebar -->
        <div class="w-64 bg-white border-r border-gray-200 shadow-md flex flex-col z-10">
            <div class="p-4 border-b border-gray-200 bg-gray-50">
                <h2 class="font-bold text-lg text-gray-700 mb-2"><i class="fas fa-boxes mr-2"></i>Inventory</h2>
                <div class="relative">
                    <input type="text" id="inventory-search" placeholder="Search components..." 
                        class="w-full pl-8 pr-3 py-1 text-sm border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500">
                    <i class="fas fa-search absolute left-2.5 top-2 text-gray-400 text-xs"></i>
                </div>
            </div>
            <div id="inventory-list" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- Inventory items will be injected here by JS -->
            </div>
        </div>

        <!-- Canvas Area -->
        <div id="workspace-container" class="flex-1 bg-gray-100 relative overflow-hidden cursor-crosshair">
            <!-- Grid Background (CSS) -->
            <div class="absolute inset-0 grid-background"></div>
            
            <!-- SVG Layer for Cables -->
            <svg id="cable-layer" class="absolute inset-0 w-full h-full pointer-events-none z-0"></svg>
            
            <!-- Component Layer -->
            <div id="component-layer" class="absolute inset-0 w-full h-full z-10">
                <!-- Dropped components go here -->
            </div>
            
            <!-- Feedback / Notifications -->
            <div id="notification-area" class="absolute top-4 right-4 z-50 pointer-events-none"></div>
        </div>
    </div>

    <script src="assets/js/hardware.js"></script>
</body>
</html>
